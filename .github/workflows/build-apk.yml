name: Build Triton AI Release APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare persistent signing key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/triton-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/triton-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"

      - name: Prepare temporary signing key (test builds only)
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/triton-temporary.jks" \
            -storepass "temporary-only-password" \
            -keypass "temporary-only-password" \
            -alias triton \
            -dname "CN=Triton AI, OU=Development, O=Triton, L=Jakarta, ST=DKI Jakarta, C=ID" \
            -keyalg RSA -keysize 2048 -validity 10000
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/triton-temporary.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=temporary-only-password" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=triton" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=temporary-only-password" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: triton-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
